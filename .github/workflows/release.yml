name: Build & Publish Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🍞 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🔨 Compile Release APK (ARM64-v8a with R8 Minification & Hermes)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag_name || 'v1.0.0' }}"
          mkdir -p release_output
          cp android/app/build/outputs/apk/release/app-release.apk release_output/CakeBox-${TAG}-arm64-v8a.apk
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_artifacts.outputs.tag }}
          name: "CakeBox ${{ steps.prepare_artifacts.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_output/*.apk
